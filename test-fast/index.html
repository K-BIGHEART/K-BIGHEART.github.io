body=`${ed?`<div class="ivs">${chem?'Chemical':'Disposable'}</div>`:`<label class="fl">Category${ivSel('cat',[['chem','Chemical'],['disp','Disposable']],F.cat)}</label>`}<label class="fl">Name${ivIn('name',F.name,'maxlength="80"')}</label>${chem?`<label class="fl">CAS No. (e.g. 67-64-1, or Mixture)${ivIn('cas',F.cas,'maxlength="40"')}</label>`:''}<label class="fl">Supplier${ivIn('vendor',F.vendor,'maxlength="60" placeholder="e.g. Sigma-Aldrich, Duksan"')}</label>${chem?`<div class="fl">Size of one container<div class="ivh">${ivIn('cap',F.cap,'type="number" min="0" step="any"')}${ivUnit('capu')}</div></div><div class="fl">Reorder when the lab total is below<div class="ivh">${ivIn('ro',F.ro,'type="number" min="0" step="any"')}${ivUnit('rou')}</div></div>`:`<div class="fl">Sizes<div class="ivzt"><div class="ivzh"><span>Size</span><span>Reorder below (boxes)</span><span>Cat. No.</span><span></span></div>${(F.zs||[]).map((z,i)=>`<div class="ivzr">${ivIn('zs_'+i+'_s',z.s,'maxlength="20" placeholder="e.g. M" aria-label="Size"')}${ivIn('zs_'+i+'_min',z.min,'type="number" min="0" step="1" placeholder="0" aria-label="Reorder below (boxes)"')}${ivIn('zs_'+i+'_cat',z.cat,'maxlength="60" placeholder="e.g. 20100" aria-label="Cat. No."')}<button data-a="i_zdel" data-id="${i}" aria-label="Remove this size" ${(F.zs||[]).length<2?'disabled':''}>✕</button></div>`).join('')}<button data-a="i_zadd" style="justify-self:start">+ Add size</button></div></div>`}<label class="fl">Main stock room${ivSel('main',R.map(r=>[r,r]),F.main)}</label><label class="fl">Cabinet${ivIn('cab',F.cab,'maxlength="60" placeholder="e.g. Flammable cabinet 1"')}</label>`;
if(ed)del='<button data-a="i_del" style="margin-right:auto">Delete item</button>'}
else{const it=IV.item(F.item);if(!it){st.modal=null;return''}const chem=it.cat=='chem',L=IV.of(it.id).filter(s=>s.left>0);
const opt=s=>[s.id,chem?s.label+' · '+IV.fmt(s.left,it)+' left'+(s.sealed?' (sealed)':''):s.size+' · '+IV.fmt(s.left,it)+' in stock'];
if(m.t=='i_rcv'){title='Receive delivery – '+it.name;btn='Add to stock';
body=`<div class="ivs">Added to the main stock room: <b>${esc(it.main||'-')}</b>${it.cab?' · '+esc(it.cab):''}</div>${it.ordered?`<div class="ivs">This also clears the <b>Ordered</b> mark (ordered ${esc(it.ordered)}).</div>`:''}`+(chem?`<label class="fl">Number of containers (${IV.fmt(it.cap,it)} each)${ivIn('c',F.c,'type="number" min="1" max="20" step="1"')}</label><label class="fl">Name of the first container (numbers count up, e.g. Drum A-06 → A-07)${ivIn('l',F.l,'maxlength="30" placeholder="e.g. Drum A-06"')}</label><label class="fl">Expiry (optional, YYYY-MM or YYYY-MM-DD)${ivIn('e',F.e,'maxlength="10" placeholder="2028-01"')}</label>`:`<label class="fl">Size${ivSel('z',(it.sizes||[]).map(z=>[z.s,z.s]),F.z)}</label><label class="fl">Boxes${ivIn('a',F.a,'type="number" min="1" step="1"')}</label>`)}
else if(m.t=='i_ord'){title='Order – '+it.name;btn='Save';body=`<div class="ivs">Shown in Status until a delivery is recorded with <b>Receive</b>.</div><label class="fl">Order date${ivIn('od',F.od,'type="date"')}</label><label class="fl">Note (optional)${ivIn('on',F.on,'maxlength="100" placeholder="e.g. 2 drums, PO 2026-118, via Duksan"')}</label>`;if(it.ordered)del='<button data-a="i_ordclr" style="margin-right:auto">Not ordered</button>'}
else if(!L.length){title=it.name;body='<p class="mut">Nothing left in stock. An administrator can add stock with <b>Receive</b>.</p>';btn=''}
else if(m.t=='i_use'){title=(chem?'Use – ':'Take – ')+it.name;btn=chem?'Record use':'Record';
body=`<div class="ivs">Main stock: <b>${esc(it.main||'-')}</b>${it.cab?' · '+esc(it.cab):''}</div><label class="fl">${chem?'From container':'Size'}${ivSel('s',L.map(opt),F.s)}</label><div class="fl">${chem?'Amount':'Boxes'}<div class="ivh">${ivIn('a',F.a,'type="number" min="0" step="any" placeholder="'+(chem?'e.g. 0.5':'e.g. 1')+'"')}${chem?ivUnit('u'):''}</div></div><label class="fl">Taken to (optional)${ivSel('to',[['','–'],...R.map(r=>[r,r])],F.to)}</label><label class="fl">Note (optional)${ivIn('n',F.n,'maxlength="200" placeholder="e.g. µMLA run, wash bottle refill"')}</label>`}
else{title='Move to a room – '+it.name;btn='Move';const s=IV.stock(F.s);if(!chem&&s&&F.to==s.room)F.to=R.find(r=>r!=s.room)||'';
let dest='';if(chem){const D=IV.of(it.id).filter(x=>x.room==F.to&&x.id!=F.s&&x.src);if(!F.d||(F.d!='new'&&!D.some(x=>x.id==F.d)))F.d=D[0]?D[0].id:'new';
dest=`<label class="fl">Into${ivSel('d',[...D.map(x=>[x.id,x.label+' · '+IV.fmt(x.left,it)+' / '+IV.fmt(x.cap,it)]),['new','+ New bottle']],F.d)}</label>${F.d=='new'?`<div class="ivh"><label class="fl" style="flex:1">New bottle name${ivIn('nl',F.nl,'maxlength="40"')}</label><div class="fl">Bottle size<div class="ivh">${ivIn('nc',F.nc,'type="number" min="0" step="any" style="width:90px"')}${ivUnit('ncu')}</div></div></div>`:''}`}
body=`<label class="fl">From${ivSel('s',L.map(opt),F.s)}</label><label class="fl">To room${ivSel('to',R.filter(r=>chem||!s||r!=s.room).map(r=>[r,r]),F.to)}</label>${dest}<div class="fl">${chem?'Amount':'Boxes'}<div class="ivh">${ivIn('a',F.a,'type="number" min="0" step="any" placeholder="'+(chem?'e.g. 1':'e.g. 2')+'"')}${chem?ivUnit('u'):''}</div></div>`}}
return`<div class="mo" data-a="mx"><div class="md" style="max-width:520px" role="dialog" aria-modal="true"><h2 style="margin:0">${esc(title)}</h2><div class="ivf">${body}</div>${m.t=='i_use'||m.t=='i_move'?`<div id="ivp" class="ivp">${invPrev()}</div>`:''}<div class="msg">${st.ivm||''}</div><div class="row" style="justify-content:flex-end">${del}<button data-a="mx">Cancel</button>${btn?`<button class="p" data-a="i_do">${btn}</button>`:''}</div></div></div>`}
function invOpen(a,id,sid){const it=IV.item(id);if(!it)return;const room=st.iroom||'all',R=IV.rooms(),L=IV.of(id).filter(s=>s.left>0);let s=sid||'';
if(!s){const inRoom=room=='all'?L:L.filter(x=>x.room==room),P=a=='i_move'&&(room=='all'||room!=it.main)?L.filter(x=>x.room==it.main):inRoom,Q=P.length?P:inRoom.length?inRoom:L;s=((it.cat=='chem'&&Q.find(x=>!x.sealed&&!x.src))||Q.find(x=>!x.sealed)||Q[0]||{}).id||''}
const to=a=='i_use'?'':(R[0]||'');
st.ivf={item:id,s,a:'',u:'L',n:'',to,d:'',nl:'Wash bottle',nc:'1',ncu:'L'};st.ivm='';st.modal={t:a}}
function invClick(a,id,b){
if(a=='i_cat'){st.icat=id;st.iopen=null;st.msg=''}
else if(a=='i_room'){st.iroom=id;st.msg=''}
else if(a=='i_open'){st.iopen=st.iopen==id?null:id}
else if(a=='i_use'||a=='i_move'){if(myObs)return;invOpen(a,id,b.dataset.s)}
else if(a=='i_rcv'){if(!isAdmin)return;const it=IV.item(id);if(!it)return;st.ivf={item:id,c:'1',l:'',e:'',z:((it.sizes||[])[0]||{}).s||'',a:''};st.ivm='';st.modal={t:a}}
else if(a=='i_item'){if(!isAdmin)return;const it=id?IV.item(id):null,R=IV.rooms(),sp=v=>v>=1000?[String(v/1000),'L']:[v?String(v):'','mL'];
if(it){const c=sp(it.cap),r=sp(it.reorder);st.ivf={id:it.id,cat:it.cat,name:it.name,cas:it.cas||'',vendor:it.vendor||'',zs:(it.sizes||[]).length?(it.sizes||[]).map(z=>({s:z.s,min:String(z.min==null?'':z.min),cat:z.cat||((it.sizes||[]).length==1?it.catno||'':'')})):[{s:'',min:'',cat:''}],cap:c[0],capu:c[1],ro:r[0],rou:r[1],main:it.main,cab:it.cab||'',note:it.note||'',sz:(it.sizes||[]).map(z=>z.s+':'+z.min).join(', ')}}
else st.ivf={id:'',cat:st.icat||'chem',name:'',cas:'',vendor:'',zs:[{s:'',min:'',cat:''}],cap:'',capu:'L',ro:'',rou:'L',main:st.iroom&&st.iroom!='all'?st.iroom:(R[0]||''),cab:'',note:'',sz:''};st.ivm='';st.modal={t:a}}
else if(a=='i_ord'){if(!isAdmin)return;const it=IV.item(id);if(!it)return;st.ivf={item:id,od:it.ordered||td(),on:it.ordnote||''};st.ivm='';st.modal={t:a}}
else if(a=='i_ordclr'){if(!isAdmin||!st.ivf)return;return run(async()=>{const r=await call('invOrder',st.ivf.item,{clear:true});if(r.err){st.ivm=bad(r.err);return}st.modal=null;st.msg=okm('Order mark cleared.')})}
else if(a=='i_del'){if(!isAdmin||!st.ivf||!st.ivf.id)return;if(!confirm('Delete this item and all of its stock records?'))return;return run(async()=>{const r=await call('invDelItem',st.ivf.id);if(r.err){st.ivm=bad(r.err);return}st.modal=null;st.msg=okm('Item deleted.')})}
else if(a=='i_zadd'){if(st.ivf&&st.ivf.zs)st.ivf.zs.push({s:'',min:'',cat:''})}
else if(a=='i_zdel'){if(st.ivf&&st.ivf.zs&&st.ivf.zs.length>1)st.ivf.zs.splice(+id,1)}
else if(a=='i_do')return invSubmit()}
function invSubmit(){const t=st.modal.t,F=st.ivf,it=IV.item(F.item),err=m=>{st.ivm=bad(m);render()};
const done=(r,m)=>{if(r.err){st.ivm=bad(r.err);return}st.modal=null;st.msg=okm(m)};
if(t=='i_use'||t=='i_move'){const a=it.cat=='chem'?ivAmt(F.a,F.u):+F.a;if(!F.s)return err('Choose where to take it from.');if(!(a>0)||(it.cat=='disp'&&!Number.isInteger(a)))return err(it.cat=='chem'?'Enter an amount.':'Enter a whole number of boxes.');
if(t=='i_use')return run(async()=>done(await call('invUse',F.s,a,[F.to?'Taken to '+F.to:'',F.n||''].filter(Boolean).join(' · ')),'Recorded.'));
if(!F.to)return err('Choose a room.');const nw=it.cat=='chem'&&F.d=='new';
return run(async()=>done(await call('invMove',F.s,F.to,it.cat=='chem'&&!nw?F.d:'',a,nw?F.nl:'',nw?ivAmt(F.nc,F.ncu):0),'Moved to '+esc(F.to)+'.'))}
if(t=='i_ord'){if(!/^\d{4}-\d{2}-\d{2}$/.test(F.od||''))return err('Enter the order date.');return run(async()=>done(await call('invOrder',it.id,{date:F.od,note:F.on||''}),'Marked as ordered.'))}
if(t=='i_rcv')return run(async()=>done(await call('invRecv',it.id,{n:parseInt(F.c,10)||0,label:F.l||'',exp:(F.e||'').trim(),size:F.z,boxes:+F.a||0}),'Stock added.'));
if(t=='i_item'){const chem=F.cat!='disp',o={cat:F.cat,name:norm(F.name),cas:chem?(F.cas||'').trim():'',vendor:norm(F.vendor),cap:chem?ivAmt(F.cap,F.capu):0,reorder:chem&&F.ro!==''?ivAmt(F.ro,F.rou):0,main:F.main,cab:F.cab||'',note:F.note||'',
sizes:(F.zs||[]).filter(z=>String(z.s||'').trim()).map(z=>({s:String(z.s).trim(),min:parseInt(z.min,10)||0,cat:String(z.cat||'').trim()}))};
if(o.name.length<2)return err('Enter a name.');if(chem&&!(o.cap>0))return err('Enter the size of one container.');if(!o.main)return err('Choose the main stock room.');
return run(async()=>done(await call('invSaveItem',F.id||'',o),F.id?'Item saved.':'Item added.'))}}
document.addEventListener('input',ev=>{const t=ev.target;if(t.id=='ivq'){st.iq=t.value;const l=$('#ivl');if(l)l.innerHTML=ivList();return}if(!t.id||t.id.slice(0,3)!='iv_'||!st.ivf)return;const k=t.id.slice(3);if(k.slice(0,3)=='zs_'){const q=k.split('_'),z=(st.ivf.zs||[])[+q[1]];if(z)z[q[2]]=t.value;return}st.ivf[k]=t.value;const p=$('#ivp');if(p)p.innerHTML=invPrev()});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset&&t.dataset.iv;if(t.id=='ivroom'){st.iroom=t.value;st.msg='';render();return}if(!k||!st.ivf)return;st.ivf[k]=t.value;if(k=='to'||k=='s')st.ivf.d='';render()});
const KBMARK=IMGS.mark||'';
/* compact header helpers */
function fixH(){const t=$('#top'),hd=t&&t.querySelector('header');if(!t)return 0;if(getComputedStyle(t).position!='sticky')return 0;return t.offsetHeight-(hd?hd.offsetHeight:0)}
function topFit(){const t=$('#top'),hd=t&&t.querySelector('header');if(t&&hd)t.style.top=(-hd.offsetHeight)+'px';miniChk()}
function miniChk(){const hd=document.querySelector('#top header');document.documentElement.classList.toggle('mini',!!hd&&hd.getBoundingClientRect().bottom<=1)}
addEventListener('scroll',miniChk,{passive:true});addEventListener('resize',topFit);
const _cr=render;render=function(){_cr();topFit()};
render();init();
</script></body></html>
